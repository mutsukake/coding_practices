# FastAPI Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobboard-api
  namespace: jobboard
  labels:
    app: jobboard-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jobboard-api
  template:
    metadata:
      labels:
        app: jobboard-api
    spec:
      containers:
      - name: api
        image: ghcr.io/your-username/job-board-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jobboard-secrets
              key: SECRET_KEY
        envFrom:
        - configMapRef:
            name: jobboard-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: jobboard-api-service
  namespace: jobboard
spec:
  selector:
    app: jobboard-api
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jobboard-api-hpa
  namespace: jobboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jobboard-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobboard-ingress
  namespace: jobboard
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  tls:
  - hosts:
    - api.jobboard.example.com
    secretName: jobboard-tls
  rules:
  - host: api.jobboard.example.com
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: jobboard-api-service
            port:
              number: 80
